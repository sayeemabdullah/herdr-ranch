name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check the mods
        run: for f in mods/*/*.js tests/*.js; do node --check "$f"; done

      - name: Unit tests
        run: node --test --test-reporter=spec

  art:
    name: art
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow

      - name: Art tests
        run: python3 -m unittest discover -s tools

      # Only the SVGs: the banner PNGs depend on the Pillow version, so their bytes differ between machines.
      - name: The checked-in SVGs match the drawing code
        run: |
          python3 tools/sprites.py
          git diff --exit-code -- '*.svg'

  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, art]
    runs-on: ubuntu-latest
    steps:
      - name: Everything passed
        run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.art.result }}" = success
